[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "B", "UP", "PL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["PLC0415"]
"api/__init__.py" = ["PLC0415"]